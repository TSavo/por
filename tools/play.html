<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pool of Radiance</title>
  <style>
    @font-face { font-family: Game Web Font; src: url(/font.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #111419; color: #edf0f5; }
    body { margin: 0; }
    main {
      max-width: 960px;
      max-width: min(960px, max(18rem, calc((100svh - 7.5rem) * 4 / 3)));
      margin: auto;
      padding: 16px clamp(12px, 3vw, 24px);
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
    header nav { display: flex; gap: 8px; }
    h1 { font-size: clamp(1.25rem, 4vw, 1.9rem); margin: .4rem 0; }
    h2 { margin-top: 0; }
    button { background: #25303b; color: inherit; border: 1px solid #546577; padding: .55rem .8rem; border-radius: 5px; font: inherit; cursor: pointer; }
    button:disabled, button[aria-disabled="true"] { opacity: .5; cursor: default; }
    #travel-art-toggle[aria-pressed="true"] { background: #604a29; border-color: #c7a36a; }
    #screen, #tile-art img { image-rendering: pixelated; }
    #screen { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; background: #000; }
    #play { position: relative; border: 1px solid #546577; container-type: inline-size; }
    #tile-art { position: absolute; inset: 0; pointer-events: none; }
    #tile-art .panel-frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    #tile-art .perspective-backdrop {
      position: absolute; left: 2.5%; top: 4%; width: 37.5%; height: 60%;
      background-size: 363.6364% 227.2727%;
      background-position: 10.3448% 21.4286%;
      image-rendering: pixelated;
    }
    #tile-art .street-viewport {
      position: absolute; left: 2.5%; top: 4%; width: 37.5%; height: 60%; display: block;
      background-color: #5598ac;
      background-image: var(--sky-texture);
    }
    #tile-art .overland-viewport {
      position: absolute; left: 7.5%; top: 12%; width: 27.5%; height: 44%;
      image-rendering: pixelated;
    }
    #travel-map {
      position: absolute; left: 2.5%; top: 4%; width: 37.5%; height: 60%; z-index: 2;
      display: grid; align-items: center; background: #19140f;
    }
    #travel-map[hidden], #close-travel-map[hidden], #phlan-approaches[hidden] { display: none; }
    #travel-map.expanded {
      inset: 3%; width: auto; height: auto; z-index: 5; grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid #a28658; box-shadow: 0 10px 30px #000a;
      padding: clamp(8px, 2vw, 18px);
    }
    #close-travel-map { justify-self: end; margin-bottom: .4rem; }
    #travel-map svg { display: block; width: 100%; height: 100%; min-height: 0; }
    #travel-map polygon { fill: transparent; stroke: transparent; stroke-width: 1.5; }
    #travel-map [data-destination][aria-disabled="false"] { cursor: pointer; stroke: #ffdf8755; }
    #travel-map [data-destination][aria-disabled="false"]:is(:hover, :focus-visible) {
      outline: none; stroke: #ffeb9f;
      filter: drop-shadow(0 0 4px #f7b13e);
    }
    #travel-map polygon[aria-disabled="false"]:is(:hover, :focus-visible) { fill: #ffda7721; }
    #travel-map .travel-marker[aria-disabled="true"] { opacity: .75; }
    #travel-map .travel-marker-paper {
      fill: url(#valhingen-parchment); stroke: #744725; stroke-width: 1;
      filter: drop-shadow(0 1.5px 1px #281708aa);
    }
    #travel-map .travel-marker-fold { fill: #a66d37; stroke: none; }
    #travel-map .travel-marker:is(:hover, :focus-visible)[aria-disabled="false"] .travel-marker-paper { stroke: #ffeb9f; }
    #travel-map .travel-marker text {
      fill: #632a20; stroke: none; font: bold 8px Georgia, serif; text-anchor: middle;
    }
    #phlan-approaches {
      position: absolute; inset: 10%; z-index: 1; overflow: auto;
      background: #211910f5; border: 1px solid #a28658; padding: clamp(12px, 3vw, 24px);
    }
    #phlan-approaches header { min-height: 0; flex-wrap: wrap; margin-bottom: .65rem; }
    #phlan-approaches h2 { margin: 0; }
    .phlan-travel-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(12rem, 100%), 1fr)); gap: .45rem; }
    .phlan-travel-options button { text-align: left; }
    #phlan-approaches details { margin-top: .75rem; }
    #phlan-approaches summary { cursor: pointer; margin-bottom: .45rem; }
    #tile-art img { position: absolute; width: 2.5%; height: 4%; display: block; }
    #tile-art .combat-sprite { width: 7.5%; height: 12%; }
    #tile-art .combat-aim-reticle {
      position: absolute;
      background: #362b29;
    }
    #tile-art .combat-aim-reticle-backed { background: transparent; }
    #tile-art .combat-aim-reticle::after {
      content: "";
      position: absolute;
      inset: 1px;
      border: 2px solid #ffcc7d;
      clip-path: polygon(0 0, 29% 0, 29% 29%, 71% 29%, 71% 0, 100% 0,
        100% 29%, 71% 29%, 71% 71%, 100% 71%, 100% 100%, 71% 100%, 71% 71%,
        29% 71%, 29% 100%, 0 100%, 0 71%, 29% 71%, 29% 29%, 0 29%);
    }
    #tile-art .sprite-fallback { position: absolute; image-rendering: pixelated; }
    #game-text { position: absolute; inset: 0; pointer-events: none; }
    #game-text span { position: absolute; width: 2.5%; height: 4%; display: grid; place-items: center;
      overflow: hidden;
      font: 600 2.58cqw / 1 "Game Web Font", ui-monospace, monospace; }
    #journal { position: absolute; inset: 4%; overflow: auto; padding: clamp(12px, 3vw, 26px); background: #17232e; border: 1px solid #8495a8; }
    #automap { position: absolute; inset: 4%; z-index: 4; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: auto;
      padding: clamp(10px, 2vw, 18px); background: #17120dF2; border: 1px solid #a28658; }
    #automap[hidden] { display: none; }
    #automap header { min-height: 0; flex-wrap: wrap; }
    #automap h2 { margin: 0; }
    #automap-svg { width: 100%; height: 100%; min-height: 16rem; }
    #automap .map-tabs { display: flex; gap: .35rem; }
    #automap .map-tabs button[aria-pressed="true"] { background: #7b6037; border-color: #d2b474; }
    #automap-svg[hidden], #atlas-view[hidden], #atlas-image-link[hidden] { display: none; }
    #atlas-view { display: grid; grid-template-rows: auto minmax(8rem, 1fr); gap: .35rem; margin-top: .4rem; }
    #atlas-view select { font: inherit; max-width: 100%; }
    #atlas-image-link { display: block; min-height: 0; }
    #atlas-image { display: block; width: 100%; height: 100%; object-fit: contain; }
    #automap .floor { fill: #6f5b3b55; }
    #automap .wall { stroke: #e2c587; stroke-width: .13; stroke-linecap: square; }
    #automap .party { fill: #f3d36d; stroke: #3a2813; stroke-width: .08; }
    #automap .landmark { fill: #cf765a; stroke: #2d180f; stroke-width: .06; }
    #automap .landmark-label { fill: #f4ead5; font: .42px Georgia, serif; paint-order: stroke; stroke: #17120d; stroke-width: .08px; }
    #automap .region-paper { fill: #b99a61; }
    #automap .region-coast { fill: #54757b; stroke: #273e42; stroke-width: .8; }
    #automap .region-land { fill: #8f8054; stroke: #4a3c27; stroke-width: .7; }
    #automap .region-river { fill: none; stroke: #537b82; stroke-width: 2.2; stroke-linecap: round; }
    #automap .region-road { fill: none; stroke: #c5a975; stroke-width: .65; stroke-dasharray: 2 1.2; }
    #automap .region-wall { fill: none; stroke: #473a2a; stroke-width: 1.2; }
    #automap .region-route { stroke: #ddc38b; stroke-width: .65; opacity: .75; }
    #automap .region-route.boat { stroke: #9bd0d7; stroke-dasharray: 1.5 1.2; }
    #automap .region-area { fill: #6a5535cc; stroke: #ead39d; stroke-width: .65; }
    #automap .region-area.current { fill: #b66d42; stroke: #fff0bc; stroke-width: 1.1; }
    #automap .region-area.destination { rx: 2; }
    #automap .region-label { fill: #fff0ca; font: 2.25px Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: #2b2118; stroke-width: .55px; stroke-linejoin: round; }
    #automap .terrain-label { fill: #3c3829; opacity: .7; font: italic 2.1px Georgia, serif; letter-spacing: .15px; }
    #automap .map-compass { fill: #362b1e; font: 4px Georgia, serif; text-anchor: middle; }
    #objective { border-left: 3px solid #edca79; padding-left: 12px; }
    #objective p, li p { margin: .35rem 0 .75rem; }
    ul { list-style: none; padding: 0; }
    li { border-top: 1px solid #415164; padding: .7rem 0; }
    li button { font-size: .85rem; margin-left: .5rem; }
    #status { min-height: 1.5em; color: #b7c5d3; margin: .75rem 0 0; }
    #audio-settings { margin: .5rem 0; padding: .8rem; border: 1px solid #546577; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .7rem 1rem; }
    #audio-settings[hidden] { display: none; }
    #audio-settings label { display: grid; gap: .25rem; }
    #audio-settings label.inline { display: flex; align-items: center; }
    [data-presentation="enhanced"] {
      background: radial-gradient(ellipse at top, #302820, #151310 75%);
      color: #f4ead5;
    }
    [data-presentation="enhanced"] h1, [data-presentation="enhanced"] h2 {
      font-family: Georgia, serif;
      font-weight: 500;
    }
    [data-presentation="enhanced"] #play {
      border-color: #886c42;
      box-shadow: 0 12px 38px #0008;
    }
    [data-presentation="enhanced"] #screen {
      aspect-ratio: 4 / 3;
    }
    [data-presentation="enhanced"] #journal {
      background: #231d17;
      border-color: #a28658;
    }
  </style>
  <script src="/play.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Pool of Radiance</h1>
      <nav aria-label="Presentation controls">
        <button id="audio-toggle" type="button" aria-expanded="false">Audio</button>
        <button id="map-toggle" type="button" aria-expanded="false" aria-keyshortcuts="M" hidden>Map</button>
        <button id="travel-art-toggle" type="button" aria-pressed="true" hidden>Travel art</button>
        <button id="presentation" type="button" aria-pressed="false" aria-keyshortcuts="F10">Enhanced display</button>
      </nav>
    </header>
    <fieldset id="audio-settings" hidden>
      <legend>Audio</legend>
      <label>Classic hardware <select id="audio-hardware"><option value="pc-speaker">PC Beeper</option><option value="tandy">Tandy</option><option value="silent">Silent</option></select></label>
      <label>Master <input id="audio-master" type="range" min="0" max="1" step="0.05" value="0.8"></label>
      <label>Effects <input id="audio-effects" type="range" min="0" max="1" step="0.05" value="1"></label>
      <label>Dialogue <input id="audio-dialogue" type="range" min="0" max="1" step="0.05" value="1"></label>
      <label>Narration <input id="audio-narration" type="range" min="0" max="1" step="0.05" value="1"></label>
      <label class="inline"><input id="audio-muted" type="checkbox"> Mute</label>
    </fieldset>
    <div id="play">
      <img id="screen" width="320" height="200" alt="Original game screen" tabindex="-1">
      <div id="tile-art" aria-hidden="true" hidden></div>
      <div id="game-text" aria-hidden="true" hidden></div>
      <section id="travel-map" aria-label="Illustrated Moonsea travel map" hidden>
        <button id="close-travel-map" type="button" hidden>Return to game</button>
        <svg viewBox="0 0 650 433.333" aria-label="The Moonsea around Phlan">
          <image id="travel-art" width="650" height="433.333" />
          <polygon data-destination="diogenes" points="37,57 90,54 108,79 90,110 49,103" role="button" aria-label="Cave of Diogenes"><title>Cave of Diogenes</title></polygon>
          <polygon data-destination="zhentil" points="33,139 74,125 129,127 128,151 99,172 37,174" role="button" aria-label="Zhentil Keep Outpost"><title>Zhentil Keep Outpost</title></polygon>
          <polygon data-destination="buccaneers" points="30,223 59,201 89,203 107,227 108,269 35,266" role="button" aria-label="Buccaneer Base"><title>Buccaneer Base</title></polygon>
          <polygon data-destination="valjevo" points="274,69 303,52 402,64 397,95 369,127 309,139 275,115" role="button" aria-label="Valjevo Castle via Stojanow Gate"><title>Valjevo Castle via Stojanow Gate</title></polygon>
          <polygon data-destination="phlan" points="207,135 274,128 309,145 368,129 412,165 453,217 449,263 380,282 346,251 312,231 264,252 222,240 187,213" role="button" aria-label="Phlan destinations" aria-controls="phlan-approaches" aria-expanded="false"><title>Choose a Phlan destination</title></polygon>
          <g class="travel-marker" data-destination="graveyard" role="button" aria-label="Valhingen Graveyard">
            <title>Valhingen Graveyard via the north gate</title>
            <defs>
              <linearGradient id="valhingen-parchment" x1="0%" y1="0%" x2="22%" y2="100%">
                <stop offset="0%" stop-color="#fff0b1" />
                <stop offset="43%" stop-color="#f3cb83" />
                <stop offset="100%" stop-color="#d19453" />
              </linearGradient>
            </defs>
            <path class="travel-marker-paper" d="M168 106Q176 102 186 104Q201 99 216 103Q229 102 236 105L232 112L235 121Q229 126 215 125Q201 129 185 125Q175 128 167 123L171 115Z" />
            <path class="travel-marker-fold" d="M168 106L176 105L171 115ZM235 121L228 121L232 112ZM167 123L177 124L171 115Z" />
            <text x="201.5" y="113">VALHINGEN</text>
            <text x="201.5" y="122">GRAVEYARD</text>
          </g>
          <polygon data-destination="nomads" points="439,44 467,27 550,25 569,54 541,88 469,85 435,61" role="button" aria-label="Nomad Camp"><title>Nomad Camp</title></polygon>
          <polygon data-destination="kobolds" points="542,122 570,102 629,98 633,130 617,165 570,158" role="button" aria-label="Kobold Caves"><title>Kobold Caves</title></polygon>
          <polygon data-destination="lizardmen" points="553,207 582,181 609,181 627,213 639,225 632,252 558,250 550,224" role="button" aria-label="Lizardman Keep"><title>Lizardman Keep</title></polygon>
          <polygon data-destination="island" points="194,317 241,301 275,292 308,306 314,340 281,361 211,362" role="button" aria-label="Sorcerer's Island"><title>Sorcerer's Island</title></polygon>
          <polygon data-destination="sokal" points="436,325 463,296 501,283 540,294 560,326 552,351 487,367 434,344" role="button" aria-label="Sokal Keep"><title>Sokal Keep</title></polygon>
        </svg>
        <section id="phlan-approaches" aria-labelledby="phlan-approaches-title" hidden>
          <header>
            <h2 id="phlan-approaches-title">Phlan destinations</h2>
            <button id="close-phlan-approaches" type="button">Back to map</button>
          </header>
          <div class="phlan-travel-options">
            <button type="button" data-approach="newPhlan">New Phlan</button>
            <button type="button" data-approach="cityHall">City Hall</button>
            <button type="button" data-approach="trainingHall">Training Hall</button>
            <button type="button" data-approach="slums">The Slums</button>
            <button type="button" data-approach="kovelMansion">Kovel Mansion</button>
            <button type="button" data-approach="templeOfBane">Temple of Bane</button>
            <button type="button" data-approach="podolPlaza">Podol Plaza</button>
            <button type="button" data-approach="kutoWell">Kuto’s Well</button>
            <button type="button" data-approach="textileHouse">Cadorna Textile House</button>
            <button type="button" data-approach="mendorLibrary">Mendor’s Library</button>
            <button type="button" data-approach="stojanow">Stojanow Gate</button>
            <button type="button" data-approach="graveyard">Valhingen Graveyard</button>
          </div>
          <details>
            <summary>Entrances and ferry docks</summary>
            <div class="phlan-travel-options">
              <button type="button" data-approach="northGate">North gate</button>
              <button type="button" data-approach="eastApproach">East approach</button>
              <button type="button" data-approach="westApproach">West approach</button>
              <button type="button" data-approach="docks">New Phlan ferry docks</button>
              <button type="button" data-approach="phlan">Nearest Phlan approach</button>
            </div>
          </details>
        </section>
      </section>
      <section id="journal" aria-label="Adventure journal" hidden>
        <h2>Adventure journal</h2>
        <button id="close-journal" type="button">Return to game</button>
        <button id="auto-track" type="button" hidden>Resume automatic tracking</button>
        <div id="objective"></div>
        <ul id="leads"></ul>
      </section>
      <section id="automap" aria-label="Automap" hidden>
        <header>
          <h2 id="automap-title">Automap</h2>
          <div class="map-tabs" role="group" aria-label="Map view">
            <button id="local-map" type="button" aria-pressed="true">Local</button>
            <button id="region-map" type="button" aria-pressed="false">Region</button>
            <button id="atlas-map" type="button" aria-pressed="false" hidden>Atlas</button>
          </div>
          <div><button id="mark-map" type="button">Mark location</button> <button id="close-map" type="button">Return to game</button></div>
        </header>
        <svg id="automap-svg" viewBox="-0.5 -0.5 17 17" role="img" aria-label="Discovered area map"></svg>
        <div id="atlas-view" hidden>
          <div><label for="atlas-sheet">Illustration</label> <select id="atlas-sheet"></select></div>
          <a id="atlas-image-link" target="_blank" rel="noopener" title="Open full-size illustration in a new tab">
            <img id="atlas-image" alt="">
          </a>
          <p id="atlas-error" role="status" hidden>Could not load this illustration.</p>
        </div>
      </section>
    </div>
    <p id="status" role="status">Starting the game…</p>
  </main>
</body>
</html>
