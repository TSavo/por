<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pool of Radiance</title>
  <style>
    @font-face { font-family: Game Web Font; src: url(/font.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #111419; color: #edf0f5; }
    body { margin: 0; }
    main {
      max-width: 960px;
      max-width: min(960px, max(18rem, calc((100svh - 7.5rem) * 4 / 3)));
      margin: auto;
      padding: 16px clamp(12px, 3vw, 24px);
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
    header nav { display: flex; gap: 8px; }
    h1 { font-size: clamp(1.25rem, 4vw, 1.9rem); margin: .4rem 0; }
    h2 { margin-top: 0; }
    button { background: #25303b; color: inherit; border: 1px solid #546577; padding: .55rem .8rem; border-radius: 5px; font: inherit; cursor: pointer; }
    button:disabled, button[aria-disabled="true"] { opacity: .5; cursor: default; }
    #street-toggle[aria-pressed="true"] { background: #604a29; border-color: #c7a36a; }
    #screen, #tile-art img { image-rendering: pixelated; }
    #screen { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; background: #000; }
    #play { position: relative; border: 1px solid #546577; container-type: inline-size; }
    #tile-art { position: absolute; inset: 0; pointer-events: none; }
    #tile-art .perspective-backdrop {
      position: absolute; left: 2.5%; top: 4%; width: 37.5%; height: 60%;
      background-size: 363.6364% 227.2727%;
      background-position: 10.3448% 21.4286%;
      image-rendering: pixelated;
    }
    #tile-art .street-viewport {
      position: absolute; left: 2.5%; top: 4%; width: 37.5%; height: 60%; display: block;
      background-color: #5598ac;
    }
    #tile-art img { position: absolute; width: 2.5%; height: 4%; display: block; }
    /* Cover subpixel gaps where the browser rounds adjacent tile edges. */
    #tile-art .terrain-tile {
      width: calc(2.5% + 0.5px);
      height: calc(4% + 0.5px);
    }
    #tile-art [data-sky] {
      background-size: 100% 1100%;
      background-repeat: no-repeat;
    }
    #tile-art [data-sky="zhentil"] { background-image: linear-gradient(#304763, #536d87 48%, #8c9ead 84%, #bbb9ad); }
    #tile-art [data-sky="swamp"] { background-image: linear-gradient(#456477, #708c92 43%, #a4aaa0 62%, #b9b19c); }
    #tile-art [data-sky="bane"] { background-image: linear-gradient(#232f49, #34445d 48%, #6c707d 78%, #8b8290); }
    #tile-art .combat-sprite { width: 7.5%; height: 12%; }
    #tile-art .sprite-fallback { position: absolute; image-rendering: pixelated; }
    #game-text { position: absolute; inset: 0; pointer-events: none; }
    #game-text span { position: absolute; width: 2.5%; height: 4%; display: grid; place-items: center;
      overflow: hidden;
      font: 600 2.58cqw / 1 "Game Web Font", ui-monospace, monospace; }
    #journal { position: absolute; inset: 4%; overflow: auto; padding: clamp(12px, 3vw, 26px); background: #17232e; border: 1px solid #8495a8; }
    #automap { position: absolute; inset: 4%; z-index: 4; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: auto;
      padding: clamp(10px, 2vw, 18px); background: #17120dF2; border: 1px solid #a28658; }
    #automap[hidden] { display: none; }
    #automap header { min-height: 0; flex-wrap: wrap; }
    #automap h2 { margin: 0; }
    #automap-svg { width: 100%; height: 100%; min-height: 16rem; }
    #automap .map-tabs { display: flex; gap: .35rem; }
    #automap .map-tabs button[aria-pressed="true"] { background: #7b6037; border-color: #d2b474; }
    #automap-svg[hidden], #atlas-view[hidden], #atlas-image-link[hidden] { display: none; }
    #atlas-view { display: grid; grid-template-rows: auto minmax(8rem, 1fr); gap: .35rem; margin-top: .4rem; }
    #atlas-view select { font: inherit; max-width: 100%; }
    #atlas-image-link { display: block; min-height: 0; }
    #atlas-image { display: block; width: 100%; height: 100%; object-fit: contain; }
    #automap .floor { fill: #6f5b3b55; }
    #automap .wall { stroke: #e2c587; stroke-width: .13; stroke-linecap: square; }
    #automap .party { fill: #f3d36d; stroke: #3a2813; stroke-width: .08; }
    #automap .landmark { fill: #cf765a; stroke: #2d180f; stroke-width: .06; }
    #automap .landmark-label { fill: #f4ead5; font: .42px Georgia, serif; paint-order: stroke; stroke: #17120d; stroke-width: .08px; }
    #automap .region-paper { fill: #b99a61; }
    #automap .region-coast { fill: #54757b; stroke: #273e42; stroke-width: .8; }
    #automap .region-land { fill: #8f8054; stroke: #4a3c27; stroke-width: .7; }
    #automap .region-river { fill: none; stroke: #537b82; stroke-width: 2.2; stroke-linecap: round; }
    #automap .region-road { fill: none; stroke: #c5a975; stroke-width: .65; stroke-dasharray: 2 1.2; }
    #automap .region-wall { fill: none; stroke: #473a2a; stroke-width: 1.2; }
    #automap .region-route { stroke: #ddc38b; stroke-width: .65; opacity: .75; }
    #automap .region-route.boat { stroke: #9bd0d7; stroke-dasharray: 1.5 1.2; }
    #automap .region-area { fill: #6a5535cc; stroke: #ead39d; stroke-width: .65; }
    #automap .region-area.current { fill: #b66d42; stroke: #fff0bc; stroke-width: 1.1; }
    #automap .region-area.destination { rx: 2; }
    #automap .region-label { fill: #fff0ca; font: 2.25px Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: #2b2118; stroke-width: .55px; stroke-linejoin: round; }
    #automap .terrain-label { fill: #3c3829; opacity: .7; font: italic 2.1px Georgia, serif; letter-spacing: .15px; }
    #automap .map-compass { fill: #362b1e; font: 4px Georgia, serif; text-anchor: middle; }
    #objective { border-left: 3px solid #edca79; padding-left: 12px; }
    #objective p, li p { margin: .35rem 0 .75rem; }
    ul { list-style: none; padding: 0; }
    li { border-top: 1px solid #415164; padding: .7rem 0; }
    li button { font-size: .85rem; margin-left: .5rem; }
    #status { min-height: 1.5em; color: #b7c5d3; margin: .75rem 0 0; }
    #audio-settings { margin: .5rem 0; padding: .8rem; border: 1px solid #546577; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .7rem 1rem; }
    #audio-settings[hidden] { display: none; }
    #audio-settings label { display: grid; gap: .25rem; }
    #audio-settings label.inline { display: flex; align-items: center; }
    [data-presentation="enhanced"] {
      background: radial-gradient(ellipse at top, #302820, #151310 75%);
      color: #f4ead5;
    }
    [data-presentation="enhanced"] h1, [data-presentation="enhanced"] h2 {
      font-family: Georgia, serif;
      font-weight: 500;
    }
    [data-presentation="enhanced"] #play {
      border-color: #886c42;
      box-shadow: 0 12px 38px #0008;
    }
    [data-presentation="enhanced"] #screen {
      aspect-ratio: 4 / 3;
    }
    [data-presentation="enhanced"] #journal {
      background: #231d17;
      border-color: #a28658;
    }
  </style>
  <script src="/play.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Pool of Radiance</h1>
      <nav aria-label="Presentation controls">
        <button id="audio-toggle" type="button" aria-expanded="false">Audio</button>
        <button id="map-toggle" type="button" aria-expanded="false" aria-keyshortcuts="M" hidden>Map</button>
        <button id="street-toggle" type="button" aria-pressed="true" hidden>3D view</button>
        <button id="presentation" type="button" aria-pressed="false" aria-keyshortcuts="F10">Enhanced display</button>
      </nav>
    </header>
    <fieldset id="audio-settings" hidden>
      <legend>Audio</legend>
      <label>Classic hardware <select id="audio-hardware"><option value="pc-speaker">PC Beeper</option><option value="tandy">Tandy</option><option value="silent">Silent</option></select></label>
      <label>Master <input id="audio-master" type="range" min="0" max="1" step="0.05" value="0.8"></label>
      <label>Effects <input id="audio-effects" type="range" min="0" max="1" step="0.05" value="1"></label>
      <label>Dialogue <input id="audio-dialogue" type="range" min="0" max="1" step="0.05" value="1"></label>
      <label>Narration <input id="audio-narration" type="range" min="0" max="1" step="0.05" value="1"></label>
      <label class="inline"><input id="audio-muted" type="checkbox"> Mute</label>
    </fieldset>
    <div id="play">
      <img id="screen" width="320" height="200" alt="Original game screen" tabindex="-1">
      <div id="tile-art" aria-hidden="true" hidden></div>
      <div id="game-text" aria-hidden="true" hidden></div>
      <section id="journal" aria-label="Adventure journal" hidden>
        <h2>Adventure journal</h2>
        <button id="close-journal" type="button">Return to game</button>
        <button id="auto-track" type="button" hidden>Resume automatic tracking</button>
        <div id="objective"></div>
        <ul id="leads"></ul>
      </section>
      <section id="automap" aria-label="Automap" hidden>
        <header>
          <h2 id="automap-title">Automap</h2>
          <div class="map-tabs" role="group" aria-label="Map view">
            <button id="local-map" type="button" aria-pressed="true">Local</button>
            <button id="region-map" type="button" aria-pressed="false">Region</button>
            <button id="atlas-map" type="button" aria-pressed="false" hidden>Atlas</button>
          </div>
          <div><button id="mark-map" type="button">Mark location</button> <button id="close-map" type="button">Return to game</button></div>
        </header>
        <svg id="automap-svg" viewBox="-0.5 -0.5 17 17" role="img" aria-label="Discovered area map"></svg>
        <div id="atlas-view" hidden>
          <div><label for="atlas-sheet">Illustration</label> <select id="atlas-sheet"></select></div>
          <a id="atlas-image-link" target="_blank" rel="noopener" title="Open full-size illustration in a new tab">
            <img id="atlas-image" alt="">
          </a>
          <p id="atlas-error" role="status" hidden>Could not load this illustration.</p>
        </div>
      </section>
    </div>
    <p id="status" role="status">Starting the game…</p>
  </main>
</body>
</html>
